name: Validate

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: juninmd/base-actions/.github/workflows/reusable-validate.yml@main

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Check for committed secrets
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|prod|staging|dev)$|(^|/)id_rsa$|(^|/).+\.pem$|(^|/).+\.key$' || true)
          if [ -n "$forbidden" ]; then
            echo "Secret files tracked: $forbidden"
            exit 1
          fi
          echo "No committed secrets found."
      - run: bun install --frozen-lockfile
        working-directory: ts
      - run: bun run typecheck
        working-directory: ts
      - run: bun test
        working-directory: ts
      - name: No prohibited cron workflows
        run: bun ts/scripts/check-no-cron.ts --repo-dir .
