name: Validate (Bun)

on:
  pull_request:
    paths: ["ts/**", ".github/workflows/validate-ts.yml", "Dockerfile.bun", ".env.example"]
  push:
    branches: [main, master]
    paths: ["ts/**", ".github/workflows/validate-ts.yml", "Dockerfile.bun", ".env.example"]

concurrency:
  group: validate-ts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: No prohibited cron workflows
        run: bun scripts/check-no-cron.ts --repo-dir ..
