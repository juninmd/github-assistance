archetypes:
- name: CLI tool
  description: single-purpose command-line tool with subcommands, JSON/table output
  stacks:
  - Go
  - Rust
  - Python + Typer
  - Node.js + TypeScript
- name: reusable library + demo
  description: well-typed library with a runnable demo and API docs
  stacks:
  - Python
  - TypeScript
  - Go
  - Rust
- name: HTTP API service
  description: REST/JSON service with OpenAPI spec, persistence and auth
  stacks:
  - Python + FastAPI
  - Go + chi
  - Node.js + Fastify
- name: terminal UI app
  description: interactive TUI with keyboard navigation
  stacks:
  - Python + Textual
  - Go + Bubble Tea
  - Rust + Ratatui
- name: web app (static/PWA)
  description: offline-capable single-page app, no backend needed
  stacks:
  - TypeScript + Vite
  - Svelte
  - React + Vite
- name: bot / automation
  description: event-driven bot for Telegram, Discord or GitHub
  stacks:
  - Python
  - Node.js + TypeScript
- name: GitHub Action / CI tool
  description: composite or JS action with fixtures and docs
  stacks:
  - TypeScript
  - Python
- name: MCP server
  description: Model Context Protocol server exposing tools/resources for one niche
  stacks:
  - TypeScript
  - Python
- name: data pipeline / analyzer
  description: reproducible ingest-transform-report job with sample data
  stacks:
  - Python + DuckDB
  - Go
  - Rust + Polars
- name: browser extension
  description: MV3 extension with options page and tests
  stacks:
  - TypeScript + Vite
twists:
- must work fully offline with zero external services
- must ship with a realistic bundled sample dataset and a one-command demo
- 'must be scriptable: every feature reachable via stable machine-readable output'
- must include a plugin/extension point with at least two built-in plugins
- must explain its results (every output carries the 'why')
- must be usable by a non-technical person in under two minutes
- must be deterministic and reproducible (seeded, snapshot-tested)
- must integrate with a real public API or open dataset (with recorded fixtures for tests)
